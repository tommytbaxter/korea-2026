<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Korea 2026 Photos</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Photos from our trip through Korea, October 13–25, 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
.day{scroll-margin-top:64px;padding-block:8px 28px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dayhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-block:14px 14px}
.dayhead .n{font-family:var(--display);font-size:36px;line-height:1;color:var(--c)}
.dayhead h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.2}
.dayhead .meta{font-size:13px;color:var(--muted)}
.dayhead a{font-size:13px;color:var(--accent);text-decoration:none;margin-left:auto}
.dayhead a:hover{text-decoration:underline}
.gallery{--h:210px;display:flex;flex-wrap:wrap;gap:8px}
.gallery::after{content:"";flex-grow:999}
.tile{all:unset;--ar:1.333;flex:var(--ar) 1 calc(var(--ar) * var(--h));height:var(--h);max-width:100%;cursor:zoom-in;position:relative;border-radius:5px;overflow:hidden;background:var(--line)}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}
.tile:hover img{transform:scale(1.03)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:18px 9px 6px;font-size:12px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .2s;display:flex;justify-content:space-between;gap:8px}
.tile .cap .m{font-family:var(--mono);opacity:.85;white-space:nowrap}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
@media (hover:none){.tile .cap{opacity:1}}
dialog{border:0;padding:0;background:transparent;max-width:min(94vw,1100px)}
dialog::backdrop{background:rgba(10,14,12,.9)}
dialog img{max-height:80vh;width:auto;max-width:100%;border-radius:4px;display:block;margin:0 auto}
dialog .lcap{color:#e9efec;font-size:14px;margin-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
dialog .lcap b{font-weight:600}
dialog .lcap .m{font-family:var(--mono);color:#a9b8b1}
dialog .x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));font:600 14px var(--body);color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.nav2{position:fixed;top:50%;transform:translateY(-50%);font:600 26px var(--body);color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;width:44px;height:44px;cursor:pointer}
.prev{left:calc(10px + env(safe-area-inset-left,0px))}.next{right:calc(10px + env(safe-area-inset-right,0px))}
.views{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;margin-bottom:4px}
.views button{font:500 14px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:7px 16px;cursor:pointer}
.views button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips .ct{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{padding:26px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center;background:var(--panel)}
@media (max-width:600px){.gallery{--h:130px;gap:6px}.views button{padding:7px 12px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="sitenav" aria-label="Site">
    <a class="brand" href="./">Korea <span>2026</span></a>
    <div class="links"><a href="./">Timeline</a><a href="photos.html" aria-current="page">Photos</a><a href="videos.html">Videos</a></div>
  </nav>
  <header class="pagehead">
    <div class="eyebrow">Photos · October 13–25, 2026</div>
    <h1>Photos</h1>
    <p id="sub"></p>
  </header>
  <div class="views" role="tablist" aria-label="Browse photos">
    <button type="button" role="tab" data-view="day">By day</button>
    <button type="button" role="tab" data-view="place">By place</button>
    <button type="button" role="tab" data-view="theme">By theme</button>
  </div>
  <nav class="chips" id="chips" aria-label="Filter"></nav>
  <main id="days"></main>
  <footer class="sitefoot">Times are Korea time as recorded by the camera. Tap any photo to see it larger. A photo can appear under more than one theme.</footer>
</div>

<dialog id="lb" aria-label="Photo viewer">
  <button class="x" id="lbx" type="button">Close</button>
  <button class="nav2 prev" id="lbp" type="button" aria-label="Previous photo">‹</button>
  <button class="nav2 next" id="lbn" type="button" aria-label="Next photo">›</button>
  <img id="lbimg" alt="">
  <div class="lcap"><span id="lbcap"></span><span class="m" id="lbmeta"></span></div>
</dialog>

<script src="trip-data.js"></script>
<script src="photo-tags.js"></script>
<script>
const COLORS=["#c0392b","#2a7fb0","#3d8f7a","#d08a16","#7b57b0","#c2477a","#5a8a24","#1f5f8b","#a0522d","#2b8a8a","#8a6d1f","#6a4c93"];
const THEME_COLORS={food:"#c0392b",people:"#2a7fb0",sights:"#a0522d",nature:"#5a8a24",street:"#7b57b0",art:"#c2477a",shopping:"#d08a16",night:"#1f5f8b",travel:"#2b8a8a",ai:"#6a4c93"};
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dlabel=iso=>{const d=new Date(iso+"T12:00:00");return `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`};
const t12=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);const ap=h<12?"AM":"PM";h=h%12||12;return `${h}:${String(m).padStart(2,"0")} ${ap}`};

// Which area of Korea a photo was taken in, from its GPS point
function area(lat,lon){
  if(lat==null) return "Other";
  if(lat<36.0) return lon>129.0?"Gyeongju":"Daegu";
  if(lat<37.0) return "East coast: Yeongdeok & Hupo";
  if(lat<37.7) return lon<126.7?"Incheon Airport":"Seoul";
  if(lat<38.0) return "Gangneung";
  return lon<128.55?"Seoraksan":"Sokcho & Yangyang";
}

// Every photo once, in trip order
const ALL=[];
TRIP.days.forEach((day,di)=>day.stops.forEach(s=>s.photos.forEach(p=>{
  const lat=p.lat??s.lat, lon=p.lon??s.lon;
  ALL.push({...p,place:p.place||s.place,date:p.date||day.date,day:di,area:area(lat,lon),tags:TAGS[p.thumb]||[]});
})));
// Seoul photos from the last morning stay under "Seoul"; airport is its own place
const AREAS=[...new Set(ALL.map(p=>p.area))];

const main=document.getElementById("days"),chips=document.getElementById("chips");
document.getElementById("sub").textContent=`${ALL.length} photos across ${TRIP.days.length} days. Browse them by day, by place, or by theme.`;

function groupsFor(view){
  if(view==="day") return TRIP.days.map((d,i)=>({key:String(i),n:i+1,title:d.title,meta:dlabel(d.date),chip:dlabel(d.date),color:COLORS[i%COLORS.length],
    link:`./#day${i}`,photos:ALL.filter(p=>p.day===i)}));
  if(view==="place") return AREAS.map((a,i)=>{const ph=ALL.filter(p=>p.area===a);const ds=[...new Set(ph.map(p=>p.date))];
    return {key:"p"+i,title:a,chip:a.replace(/:.*/,""),meta:ds.length>1?`${dlabel(ds[0])} – ${dlabel(ds[ds.length-1])}`:dlabel(ds[0]),color:COLORS[(i*5)%COLORS.length],photos:ph}});
  return THEMES.map(([k,label])=>({key:k,title:label,chip:label,color:THEME_COLORS[k]||"#5d6b65",photos:ALL.filter(p=>p.tags.includes(k)),
    empty:k==="ai"?"AI art from the trip will go here.":"No photos here yet."}));
}

let VIEW="day",FILTER="all",ORDER=[];
function render(){
  const groups=groupsFor(VIEW);
  document.querySelectorAll(".views button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===VIEW?"true":"false"));
  chips.innerHTML="";
  const mk=(label,val,c,count)=>{const b=document.createElement("button");b.type="button";b.dataset.v=val;
    if(c)b.style.setProperty("--c",c);
    b.innerHTML=(c?'<span class="sw"></span>':"")+esc(label)+(count!=null?` <span class="ct">${count}</span>`:"");
    b.setAttribute("aria-pressed",val===FILTER?"true":"false");chips.appendChild(b)};
  mk(VIEW==="day"?"All days":VIEW==="place"?"All places":"All themes","all");
  groups.forEach(g=>mk(g.chip,g.key,g.color,VIEW==="day"?null:g.photos.length));
  ORDER=[];main.innerHTML="";
  groups.filter(g=>FILTER==="all"||g.key===FILTER).forEach(g=>{
    if(FILTER==="all"&&!g.photos.length&&g.key!=="ai") return;
    const sec=document.createElement("section");sec.className="day";sec.style.setProperty("--c",g.color);
    sec.innerHTML=`<div class="dayhead">${g.n?`<span class="n">${g.n}</span>`:""}<h2>${esc(g.title)}</h2>
      <span class="meta">${g.meta?esc(g.meta)+" · ":""}${g.photos.length} photo${g.photos.length===1?"":"s"}</span>
      ${g.link?`<a href="${g.link}">See on the timeline →</a>`:""}</div>`;
    if(!g.photos.length){sec.insertAdjacentHTML("beforeend",`<div class="empty">${esc(g.empty)}</div>`);main.appendChild(sec);return}
    const gal=document.createElement("div");gal.className="gallery";
    g.photos.forEach(p=>{const k=ORDER.length;ORDER.push(p);
      const b=document.createElement("button");b.className="tile";b.type="button";b.dataset.k=k;
      b.setAttribute("aria-label",`${p.place}${p.time?", "+t12(p.time):""}`);
      const sub=VIEW==="day"?t12(p.time):dlabel(p.date);
      b.innerHTML=`<img src="thumbs/${encodeURIComponent(p.thumb)}" alt="${esc(p.note||p.place)}" loading="lazy" decoding="async" onload="this.parentNode.style.setProperty('--ar',(this.naturalWidth/this.naturalHeight).toFixed(3))">
        <span class="cap"><span>${esc(p.place)}</span><span class="m">${sub}</span></span>`;
      gal.appendChild(b)});
    sec.appendChild(gal);main.appendChild(sec);
  });
  const h=VIEW==="day"&&FILTER==="all"?"":"#"+VIEW+(FILTER==="all"?"":"/"+FILTER);
  history.replaceState(null,"",location.pathname+h);
}
document.querySelector(".views").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.view===VIEW)return;VIEW=b.dataset.view;FILTER="all";render()});
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;FILTER=b.dataset.v;render();window.scrollTo({top:main.offsetTop-60,behavior:"smooth"})});
// Open straight to a view from a link, e.g. photos.html#theme/food
(()=>{const [v,f]=location.hash.slice(1).split("/");if(["day","place","theme"].includes(v)){VIEW=v;if(f)FILTER=decodeURIComponent(f)}})();
render();

// Viewer
const lb=document.getElementById("lb"),img=document.getElementById("lbimg"),cap=document.getElementById("lbcap"),meta=document.getElementById("lbmeta");
let cur=0;
function show(k){cur=k;const p=ORDER[k];img.src="thumbs/"+encodeURIComponent(p.thumb);img.alt=p.note||p.place;
  cap.innerHTML=`<b>${esc(p.place)}</b>${p.note?" · "+esc(p.note):""}`;
  meta.textContent=`${dlabel(p.date)}${p.time?" · "+t12(p.time):""}`}
const step=d=>show((cur+d+ORDER.length)%ORDER.length);
main.addEventListener("click",e=>{const b=e.target.closest(".tile");if(!b)return;show(+b.dataset.k);lb.showModal()});
document.getElementById("lbx").onclick=()=>lb.close();
document.getElementById("lbp").onclick=()=>step(-1);
document.getElementById("lbn").onclick=()=>step(1);
lb.addEventListener("click",e=>{if(e.target===lb)lb.close()});
document.addEventListener("keydown",e=>{if(!lb.open)return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let sx=null;lb.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
lb.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)step(dx<0?1:-1);sx=null});
</script>
</body></html>
